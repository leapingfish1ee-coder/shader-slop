<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shader Slop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}
body{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
aside{min-height:100vh;padding:24px 16px;border-right:1px solid #ddd;background:#fff}
h1{margin:0 0 18px;font-size:14px;font-weight:600}
ul{margin:0;padding:0;list-style:none}
button{width:100%;padding:10px 12px;border:0;border-radius:8px;background:#eee;color:#111;text-align:left;font:inherit;cursor:pointer}
button[aria-current="true"]{background:#111;color:#fff}
main{min-width:0;display:grid;place-items:center;padding:32px}
#shader{width:min(72vmin,720px);aspect-ratio:1;background:#000}
@media(max-width:640px){body{grid-template-columns:160px 1fr}aside{padding:18px 12px}main{padding:20px}#shader{width:min(68vmin,560px)}}
</style>
</head>
<body>
<aside>
<h1>Shaders</h1>
<ul>
<li><button type="button" aria-current="true">Default</button></li>
</ul>
</aside>
<main>
<div id="shader" aria-label="Shader container"></div>
</main>
</body>
</html>

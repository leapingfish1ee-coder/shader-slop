<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shader Slop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0b;color:#f2f2f2}
body{overflow:hidden}
aside{position:fixed;top:20px;left:20px;z-index:2;width:200px;padding:16px;border:1px solid #2a2a2a;border-radius:12px;background:#151515;box-shadow:0 12px 32px #0008}
h1{margin:0 0 12px;font-size:14px;font-weight:600}
ul{margin:0;padding:0;list-style:none}
button{width:100%;padding:10px 12px;border:0;border-radius:8px;background:#222;color:#ddd;text-align:left;font:inherit;cursor:pointer}
button[aria-current="true"]{background:#333;color:#fff}
#shader{position:fixed;top:50%;left:50%;width:min(72vmin,720px);aspect-ratio:1;transform:translate(-50%,-50%);background:#000}
</style>
</head>
<body>
<aside>
<h1>Shaders</h1>
<ul>
<li><button type="button" aria-current="true">Default</button></li>
</ul>
</aside>
<div id="shader" aria-label="Shader container"></div>
</body>
</html>
